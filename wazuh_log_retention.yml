---
# Keep Wazuh application logs and indexed data for a fixed number of days.
#
# Installs a small purge script plus a daily cron job on the Wazuh server, and
# aligns the indexer logrotate config with the same retention. Only rotated or
# archived files are deleted - live log files (e.g. the indexer slowlogs, which
# can sit idle for weeks) are never touched.
#
# Also manages an OpenSearch ISM policy that deletes wazuh-alerts/monitoring/
# statistics indices older than wazuh_ism_retention_days.
#
# Usage:
#   ansible-playbook -i inventory wazuh_log_retention.yml
#   ansible-playbook -i inventory wazuh_log_retention.yml -e wazuh_log_retention_days=30
#   ansible-playbook -i inventory wazuh_log_retention.yml -e wazuh_log_retention_run_now=true
#   ansible-playbook -i inventory wazuh_log_retention.yml -t ism     # indexer ISM policy only
#   ansible-playbook -i inventory wazuh_log_retention.yml -t replicas  # single-node: replicas to 0

- name: Configure Wazuh log retention
  hosts: wazuh
  remote_user: root
  become: true
  vars:
    wazuh_log_retention_days: 14
    wazuh_log_retention_script: /usr/local/sbin/wazuh-log-retention
    wazuh_log_retention_cron_hour: "1"
    wazuh_log_retention_cron_minute: "30"
    # Set to true to also run the purge immediately after installing it
    wazuh_log_retention_run_now: false

    # Wazuh indexer (OpenSearch) ISM retention for indexed data
    wazuh_ism_retention_days: 14
    wazuh_ism_policy_id: wazuh-alert-retention-policy
    wazuh_ism_index_patterns:
      - wazuh-alerts-*
      - wazuh-monitoring-*
      - wazuh-statistics-*
    wazuh_indexer_url: https://127.0.0.1:9200
    wazuh_indexer_certs: /etc/wazuh-indexer/certs
    # Single-node indexer: force replicas to 0 so cluster health can be green
    wazuh_indexer_single_node: true
    wazuh_ism_states:
      - name: retention_state
        actions: []
        transitions:
          - state_name: delete_alerts
            conditions:
              min_index_age: "{{ wazuh_ism_retention_days }}d"
      - name: delete_alerts
        actions:
          - retry:
              count: 3
              backoff: exponential
              delay: 1m
            delete: {}
        transitions: []
  tasks:
    - name: Ensure cronie is installed
      ansible.builtin.package:
        name: cronie
        state: present

    - name: Install log retention script
      ansible.builtin.copy:
        dest: "{{ wazuh_log_retention_script }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          # Managed by Ansible (patching/wazuh_log_retention.yml) - do not edit by hand.
          # Purge rotated Wazuh application logs older than RETENTION_DAYS.
          # Only rotated/archived files are touched - live log files are never deleted.
          RETENTION_DAYS={{ wazuh_log_retention_days | int }}
          TAG=wazuh-log-retention

          # Wazuh manager: rotated logs live under /var/ossec/logs/<type>/YYYY/Mon/
          for d in alerts archives api firewall wazuh cluster; do
              [ -d "/var/ossec/logs/$d" ] || continue
              find "/var/ossec/logs/$d" -mindepth 3 -type f -mtime +"$RETENTION_DAYS" -print -delete
              find "/var/ossec/logs/$d" -mindepth 1 -type d -empty -print -delete
          done | logger -t "$TAG"

          # Wazuh indexer: rotated logs only (gz archives, dated deprecation logs, rotated GC logs)
          if [ -d /var/log/wazuh-indexer ]; then
              find /var/log/wazuh-indexer -maxdepth 1 -type f -mtime +"$RETENTION_DAYS" \
                  \( -name '*.gz' -o -name '*_deprecation.*-[0-9]*' -o -name 'gc.log.*' \) \
                  -print -delete | logger -t "$TAG"
          fi

    - name: Schedule daily log retention job
      ansible.builtin.cron:
        name: wazuh-log-retention
        cron_file: wazuh-log-retention
        user: root
        hour: "{{ wazuh_log_retention_cron_hour }}"
        minute: "{{ wazuh_log_retention_cron_minute }}"
        job: "{{ wazuh_log_retention_script }}"

    - name: Check for indexer logrotate config
      ansible.builtin.stat:
        path: /etc/logrotate.d/wazuh
      register: wazuh_logrotate

    - name: Align indexer logrotate retention
      ansible.builtin.lineinfile:
        path: /etc/logrotate.d/wazuh
        regexp: '^\s*rotate\s+\d+'
        line: "    rotate {{ wazuh_log_retention_days | int }}"
      when: wazuh_logrotate.stat.exists

    - name: Run log retention now
      ansible.builtin.command: "{{ wazuh_log_retention_script }}"
      when: wazuh_log_retention_run_now | bool
      changed_when: true

    # ------------------------------------------------------------------
    # Indexer data: ISM policy that deletes Wazuh indices after N days.
    # ism_template auto-attaches the policy to newly created indices; the
    # "add" call attaches it to any existing indices that are unmanaged.
    # Note: min_index_age counts from index creation, so weekly
    # monitoring/statistics indices keep between N-7 and N days of data.
    # ------------------------------------------------------------------
    - name: Read current ISM retention policy
      ansible.builtin.uri:
        url: "{{ wazuh_indexer_url }}/_plugins/_ism/policies/{{ wazuh_ism_policy_id }}"
        method: GET
        ca_path: "{{ wazuh_indexer_certs }}/root-ca.pem"
        client_cert: "{{ wazuh_indexer_certs }}/admin.pem"
        client_key: "{{ wazuh_indexer_certs }}/admin-key.pem"
        status_code: [200, 404]
      register: wazuh_ism_current
      check_mode: false
      tags: [ism]

    - name: Create or update ISM retention policy
      ansible.builtin.uri:
        url: >-
          {{ wazuh_indexer_url }}/_plugins/_ism/policies/{{ wazuh_ism_policy_id }}{{
          ('?if_seq_no=' ~ wazuh_ism_current.json._seq_no ~ '&if_primary_term=' ~ wazuh_ism_current.json._primary_term)
          if wazuh_ism_current.status == 200 else '' }}
        method: PUT
        ca_path: "{{ wazuh_indexer_certs }}/root-ca.pem"
        client_cert: "{{ wazuh_indexer_certs }}/admin.pem"
        client_key: "{{ wazuh_indexer_certs }}/admin-key.pem"
        body_format: json
        body:
          policy:
            description: "Wazuh indices retention policy ({{ wazuh_ism_retention_days }} days) - managed by Ansible"
            default_state: retention_state
            states: "{{ wazuh_ism_states }}"
            ism_template:
              - index_patterns: "{{ wazuh_ism_index_patterns }}"
                priority: 1
        status_code: [200, 201]
      when: >-
        wazuh_ism_current.status == 404 or
        wazuh_ism_current.json.policy.states != wazuh_ism_states or
        (wazuh_ism_current.json.policy.ism_template | default([], true)
          | map(attribute='index_patterns') | flatten | sort) != (wazuh_ism_index_patterns | sort)
      changed_when: true
      tags: [ism]

    - name: Attach ISM policy to existing unmanaged indices
      ansible.builtin.uri:
        url: "{{ wazuh_indexer_url }}/_plugins/_ism/add/{{ wazuh_ism_index_patterns | join(',') }}"
        method: POST
        ca_path: "{{ wazuh_indexer_certs }}/root-ca.pem"
        client_cert: "{{ wazuh_indexer_certs }}/admin.pem"
        client_key: "{{ wazuh_indexer_certs }}/admin-key.pem"
        body_format: json
        body:
          policy_id: "{{ wazuh_ism_policy_id }}"
      register: wazuh_ism_add
      when: not ansible_check_mode
      changed_when: wazuh_ism_add.json.updated_indices | default(0) > 0
      # Indices that already have a policy are reported as failures; ignore those only
      failed_when: >-
        wazuh_ism_add.status != 200 or
        (wazuh_ism_add.json.failed_indices | default([])
          | rejectattr('reason', 'search', 'already has a policy') | list | length > 0)
      tags: [ism]

    - name: Report indices newly attached to the ISM policy  # noqa: no-handler
      ansible.builtin.debug:
        msg: "Attached {{ wazuh_ism_policy_id }} to {{ wazuh_ism_add.json.updated_indices }} index(es)"
      when: wazuh_ism_add is changed
      tags: [ism]

    # ------------------------------------------------------------------
    # Single-node indexer: replicas can never be allocated, which leaves
    # the cluster yellow. Drop replicas to 0 on any yellow index and stop
    # the daily ISM history index from being created with a replica.
    # ------------------------------------------------------------------
    - name: Set ISM history indices to 0 replicas
      ansible.builtin.uri:
        url: "{{ wazuh_indexer_url }}/_cluster/settings"
        method: PUT
        ca_path: "{{ wazuh_indexer_certs }}/root-ca.pem"
        client_cert: "{{ wazuh_indexer_certs }}/admin.pem"
        client_key: "{{ wazuh_indexer_certs }}/admin-key.pem"
        body_format: json
        body:
          persistent:
            plugins.index_state_management.history.number_of_replicas: 0
      when: wazuh_indexer_single_node | bool and not ansible_check_mode
      changed_when: false
      tags: [replicas]

    - name: List yellow indices
      ansible.builtin.uri:
        url: "{{ wazuh_indexer_url }}/_cat/indices?h=index,health&format=json&expand_wildcards=all"
        method: GET
        ca_path: "{{ wazuh_indexer_certs }}/root-ca.pem"
        client_cert: "{{ wazuh_indexer_certs }}/admin.pem"
        client_key: "{{ wazuh_indexer_certs }}/admin-key.pem"
      register: wazuh_indices_health
      check_mode: false
      when: wazuh_indexer_single_node | bool
      tags: [replicas]

    - name: Set replicas to 0 on yellow indices
      ansible.builtin.uri:
        url: "{{ wazuh_indexer_url }}/{{ wazuh_yellow_indices | join(',') }}/_settings?expand_wildcards=all"
        method: PUT
        ca_path: "{{ wazuh_indexer_certs }}/root-ca.pem"
        client_cert: "{{ wazuh_indexer_certs }}/admin.pem"
        client_key: "{{ wazuh_indexer_certs }}/admin-key.pem"
        body_format: json
        body:
          index:
            number_of_replicas: 0
      vars:
        wazuh_yellow_indices: "{{ wazuh_indices_health.json | selectattr('health', 'equalto', 'yellow') | map(attribute='index') | list }}"
      when:
        - wazuh_indexer_single_node | bool
        - not ansible_check_mode
        - wazuh_yellow_indices | length > 0
      changed_when: true
      tags: [replicas]
